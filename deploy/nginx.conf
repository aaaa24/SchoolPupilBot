upstream schoolpupilbot_prod {
    server 127.0.0.1:8080;
}

upstream schoolpupilbot_preprod {
    server 127.0.0.1:8081;
}

limit_req_zone $binary_remote_addr zone=schoolpupilbot:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/SERVER_ADDRESS/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_ADDRESS/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 25m;

    location = /telegram {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;

        proxy_pass http://schoolpupilbot_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /preprod/telegram {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;

        proxy_pass http://schoolpupilbot_preprod/telegram;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /internal/yookassa {
        limit_req zone=schoolpupilbot burst=5 nodelay;

        proxy_pass http://schoolpupilbot_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /preprod/internal/yookassa {
        limit_req zone=schoolpupilbot burst=5 nodelay;

        proxy_pass http://schoolpupilbot_preprod/internal/yookassa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://schoolpupilbot_prod;
    }

    location = /preprod/health {
        proxy_pass http://schoolpupilbot_preprod/health;
    }

    location / {
        return 404;
    }
}
