name: CD — deploy to Yandex Cloud Functions and server

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  id-token: write

env:
  SRC_PATH: "./src"
  BOT_ENTRYPOINT: "index.handler"
  RUNTIME: "python314"

jobs:
  deploy-preprod:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: preprod
    env:
      BOT_FUNCTION_NAME: bot-preprod
    steps: &deploy-steps
      - uses: actions/checkout@v4
      - name: Get IAM token
        id: get-iam-token
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ secrets.YC_SA_ID }}

      - name: Deploy function (bot)
        uses: yc-actions/yc-sls-function@v4.1.0
        with:
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          function-name: ${{ env.BOT_FUNCTION_NAME }}
          source-root: ${{ env.SRC_PATH }}
          runtime: ${{ env.RUNTIME }}
          entrypoint: ${{ env.BOT_ENTRYPOINT }}
          service-account: ${{ secrets.FUNCTION_SA_ID }}
          yc-iam-token: ${{ steps.get-iam-token.outputs.token }}
          memory: 256Mb
          execution-timeout: 600
          logs-group-id: ${{ secrets.LOG_GROUP_ID }}
          environment: |
            YDB_DATABASE=${{ secrets.YDB_DATABASE }}
            YDB_ENDPOINT=${{ secrets.YDB_ENDPOINT }}
            MAX_SUPERADMIN=${{ secrets.MAX_SUPERADMIN }}
            MAX_TECHNO_INFO=${{ secrets.MAX_TECHNO_INFO }}
            LOG_GROUP_ID=${{ secrets.LOG_GROUP_ID }}
            VK_APP_ID=${{ secrets.VK_APP_ID }}
            VK_DOMAIN=${{ secrets.VK_DOMAIN }}
            YOOKASSA_ACCOUNT_ID=${{ secrets.YOOKASSA_ACCOUNT_ID }}
            MAX_API_BASE_URL=${{ secrets.MAX_API_BASE_URL }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            S3_ENDPOINT_URL=${{ secrets.S3_ENDPOINT_URL }}
            BUCKET_NAME=${{ secrets.BUCKET_NAME }}
            SERVER_WEBHOOK_URL=${{ secrets.SERVER_WEBHOOK_URL }}
            MESSENGERS=max
            YDB_MODE=cloud
            LOG_MODE=cloud
          secrets: |
            MAX_BOT_TOKEN=${{ secrets.LOCKBOX_ID }}/latest/MAX_BOT_TOKEN
            YOOKASSA_SECRET_KEY=${{ secrets.LOCKBOX_ID }}/latest/YOOKASSA_SECRET_KEY
            AWS_SECRET_ACCESS_KEY=${{ secrets.LOCKBOX_ID }}/latest/AWS_SECRET_ACCESS_KEY
            VK_ACCESS_TOKEN=${{ secrets.LOCKBOX_ID }}/latest/VK_ACCESS_TOKEN
            PROXY_SECRET=${{ secrets.LOCKBOX_ID }}/latest/PROXY_SECRET

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      BOT_FUNCTION_NAME: bot-prod
    steps: *deploy-steps

  deploy-server-preprod:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: preprod
    env:
      INSTANCE: preprod
      PORT: 8081
      WORKERS: 1
    steps: &deploy-server-steps
      - uses: actions/checkout@v4

      - name: Настроить доступ по SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Выгрузить код
        env:
          TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/schoolpupilbot/${{ env.INSTANCE }}
        run: |
          for dir in src server deploy; do
            rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" "$dir/" "$TARGET/$dir/"
          done

      - name: Выгрузить файл окружения
        run: |
          cat > instance.env << 'EOF'
          MESSENGERS=telegram
          PORT=${{ env.PORT }}
          WORKERS=${{ env.WORKERS }}

          LOCKBOX_SECRET_ID=${{ secrets.LOCKBOX_ID }}
          YC_SERVICE_ACCOUNT_KEY_FILE=/etc/schoolpupilbot/authorized_key.json

          YDB_MODE=cloud-local
          YDB_DATABASE=${{ secrets.YDB_DATABASE }}
          YDB_ENDPOINT=${{ secrets.YDB_ENDPOINT }}

          LOG_MODE=local
          LOG_INGEST=cloud
          LOG_GROUP_ID=${{ secrets.LOG_GROUP_ID }}
          LOG_RESOURCE_ID=bot-server-${{ env.INSTANCE }}

          TELEGRAM_SUPERADMIN=${{ secrets.TELEGRAM_SUPERADMIN }}
          TELEGRAM_TECHNO_INFO=${{ secrets.TELEGRAM_TECHNO_INFO }}
          CHANNEL_PERVYE=${{ secrets.CHANNEL_PERVYE }}

          VK_APP_ID=${{ secrets.VK_APP_ID }}
          VK_DOMAIN=${{ secrets.VK_DOMAIN }}

          YOOKASSA_ACCOUNT_ID=${{ secrets.YOOKASSA_ACCOUNT_ID }}

          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          S3_ENDPOINT_URL=${{ secrets.S3_ENDPOINT_URL }}
          BUCKET_NAME=${{ secrets.BUCKET_NAME }}

          CERT_PATH=/etc/letsencrypt/live/${{ secrets.SERVER_HOST }}/cert.pem
          EOF
          scp -i ~/.ssh/id_deploy instance.env \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/schoolpupilbot/$INSTANCE/env"

      - name: Обновить зависимости и перезапустить
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "set -e
             cd /opt/schoolpupilbot/$INSTANCE
             chmod 640 env
             venv/bin/pip install -q -r server/requirements.txt
             sudo systemctl restart schoolpupilbot@$INSTANCE"

      - name: Обновить конфиг nginx
        if: env.INSTANCE == 'prod'
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "set -e
             sed 's/SERVER_ADDRESS/${{ secrets.SERVER_HOST }}/g' \
                 /opt/schoolpupilbot/prod/deploy/nginx.conf > /opt/schoolpupilbot/prod/nginx.rendered
             sudo /usr/bin/install -m 644 -o root -g root \
                 /opt/schoolpupilbot/prod/nginx.rendered /etc/nginx/sites-available/schoolpupilbot
             sudo /usr/sbin/nginx -t
             sudo /usr/bin/systemctl reload nginx"

      - name: Проверить, что экземпляр поднялся
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "for i in \$(seq 30); do
               curl -fsS http://127.0.0.1:$PORT/health && exit 0
               sleep 2
             done
             exit 1"

  deploy-server-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      INSTANCE: prod
      PORT: 8080
      WORKERS: 2
    steps: *deploy-server-steps
